name: Validate library

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: doublesharp/foundry@a6e5db53bb23230eceb0600d6c1bdfafc1bfb47e # setup-forgeds-v1.0.2
        with:
          forgeds-version: 9287d4b46d2bbecb17deb41cd5cb385fc31a503c
          forge-alias: 'true'
          cache-compilers: 'true'
          cache-prefix: unsafe-math
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Configure disposable outputs
        run: |
          echo "UNSAFE_MATH_BUILD_DIR=$RUNNER_TEMP/unsafe-math-build" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: node --test scripts/release.test.cjs
